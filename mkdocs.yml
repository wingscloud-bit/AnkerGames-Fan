
site_name: AnkerGames Fan
site_description: Community guides and resources for AnkerGames.
site_url: https://wingscloud-bit.github.io/AnkerGames-Fan/
repo_url: https://github.com/wingscloud-bit/AnkerGames-Fan
repo_name: wingscloud-bit/AnkerGames-Fan

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Documentation:
      - Game Library: game-library.md
      - Game Search: game-search.md
      - Game Filters: game-filters.md
      - Trending Games: trending-games.md
      - Game of the Day: game-of-the-day.md
      - Collections: collections.md
      - Community Features: community-features.md
      - Developers & Publishers: developer-publishers.md
  - Resources:
      - Game Discovery: resources/game-discovery.md
      - Gaming Resources: resources/gaming-resources.md
      - PC Gaming Tools: resources/pc-gaming-tools.md
  - Help:
      - FAQ: FAQ.md
      - Changelog: CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
